name: Deploy JobsShadow to GitHub Pages

# Publishes the jobs-shadow/ folder as the site root so it is reachable over
# HTTPS (required for microphone access on phones).

on:
  push:
    branches:
      - master
      - main
      - cursor/jobs-shadowing-english-trainer-b8da
    paths:
      - "jobs-shadow/**"
      - ".github/workflows/jobs-shadow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload jobs-shadow as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: jobs-shadow

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
